<!doctype html>
<html lang="en">
<head><title>Native canvas example</title></head>
<body>
    <canvas id="scene" class="viewport" tabindex="0"></canvas>
    <button id="pause" class="primary">Pause / play</button>
    <button id="reset">Reset</button>
    <label id="hint">Drag inside the view to move the marker. Space pauses when the view has focus.</label>
</body>
</html>
